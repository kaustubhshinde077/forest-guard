name: Forest Guard Autonomous 21-Day Monitoring & Deploy

on:
  # AUTOMATED SCHEDULE DISABLED: In accordance with Stage 2 safety protocol,
  # automatic daily scheduling remains disabled until ingestion safeguards, MGRS mosaicing,
  # and real hosted-runner telemetry have been empirically verified and approved.
  # schedule:
  #   - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      batch_day:
        description: 'Scheduled batch day (1 to 21) from Maharashtra GIS catalogue'
        required: false
        type: number
        default: 1
      max_tiles:
        description: 'Maximum tiles to evaluate in this test run (e.g. 5 for rapid verification, 71 for full batch)'
        required: false
        type: number
        default: 5
      force_run:
        description: 'Force monitoring execution immediately (bypasses 21-day due-time check)'
        required: false
        type: boolean
        default: false
      allow_synthetic:
        description: 'Allow offline test fixtures fallback (simulated evaluation mode only)'
        required: false
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and git commits
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'forestguard-pages-deploy'
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 21-Day Forest Guard Monitoring Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          PYTHONPATH: src
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          
          SYNTHETIC_FLAG=""
          if [ "${{ inputs.allow_synthetic }}" = "true" ]; then
            SYNTHETIC_FLAG="--allow-synthetic"
          fi

          BATCH_FLAG=""
          if [ -n "${{ inputs.batch_day }}" ]; then
            BATCH_FLAG="--batch-day ${{ inputs.batch_day }}"
          fi

          MAX_TILES_FLAG=""
          if [ -n "${{ inputs.max_tiles }}" ]; then
            MAX_TILES_FLAG="--max-tiles ${{ inputs.max_tiles }}"
          fi
          
          python -m forestguard.workflow_runner $FORCE_FLAG $SYNTHETIC_FLAG $BATCH_FLAG $MAX_TILES_FLAG

      - name: Commit & push updated monitoring data and reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/public/data/
          if git diff --staged --quiet; then
            echo "No monitoring state or report changes to commit."
          else
            git commit -m "chore(data): automated 21-day monitoring update [skip ci]"
            git push
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js static export for GitHub Pages
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
